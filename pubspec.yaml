name: medadhere
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.3.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  flutter_local_notifications: ^20.1.0
  google_fonts: ^8.1.0
  go_router: ^17.2.2
  disable_battery_optimization:
  http: ^1.6.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.1.0
  flutter_timezone: ^5.0.2
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/illustrations/app_icon.png"
  min_sdk_android: 21